<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CodeTrix LMS - User Page</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
      }

      header {
        background: #111827;
        color: white;
        padding: 18px 30px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        font-size: 22px;
      }

      .header-user {
        text-align: right;
      }

      .header-name {
        font-weight: bold;
      }

      .header-role {
        font-size: 13px;
        opacity: 0.7;
      }

      main {
        max-width: 1400px;
        margin: auto;
        padding: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 25px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      }

      .card h2 {
        margin-bottom: 20px;
      }

      .profile-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }

      .info {
        background: #f8f9fb;
        padding: 15px;
        border-radius: 7px;
      }

      .info-label {
        display: block;
        font-size: 12px;
        color: #777;
        margin-bottom: 5px;
      }

      .info-value {
        font-weight: bold;
      }

      .group-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }

      .group-card {
        border: 1px solid #e5e7eb;
        border-radius: 9px;
        padding: 20px;
      }

      .group-card h3 {
        margin-bottom: 12px;
      }

      .group-card p {
        margin: 7px 0;
        color: #555;
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }

      th {
        background: #f8f9fb;
      }

      select {
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        padding: 9px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .btn-primary {
        background: #2563eb;
        color: white;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .btn-danger {
        background: #dc2626;
        color: white;
      }

      .logout {
        margin-top: 20px;
        background: #dc2626;
        color: white;
      }

      .empty {
        color: #777;
        padding: 15px 0;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 14px;
        border-radius: 6px;
      }

      .success {
        background: #dcfce7;
        color: #166534;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
      }

      .lesson-card {
        border: 1px solid #e5e7eb;
        padding: 18px;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      .lesson-card h3 {
        margin-bottom: 10px;
      }

      .lesson-card p {
        margin: 6px 0;
        color: #555;
      }

      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 5px;
        background: #e5e7eb;
        font-size: 12px;
      }

      @media (max-width: 800px) {
        main {
          padding: 15px;
        }

        .profile-grid {
          grid-template-columns: 1fr;
        }

        header {
          padding: 15px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>CodeTrix LMS</h1>

      <div class="header-user">
        <div class="header-name" id="headerName">Loading...</div>

        <div class="header-role" id="headerRole">Loading...</div>
      </div>
    </header>

    <main>
      <!-- ================================================= -->
      <!-- PROFILE -->
      <!-- ================================================= -->

      <section class="card">
        <h2>My Profile</h2>

        <div id="profile">Loading...</div>

        <button class="logout" onclick="logout()">Logout</button>
      </section>

      <!-- ================================================= -->
      <!-- GROUPS -->
      <!-- ================================================= -->

      <section class="card">
        <h2 id="groupsTitle">My Group</h2>

        <div id="groups">Loading...</div>
      </section>

      <!-- ================================================= -->
      <!-- LESSONS -->
      <!-- ================================================= -->

      <section class="card">
        <h2>Lessons</h2>

        <div id="lessons">Loading...</div>
      </section>

      <!-- ================================================= -->
      <!-- ATTENDANCE -->
      <!-- ================================================= -->

      <section class="card">
        <h2>Attendance</h2>

        <div id="attendance">Loading...</div>
      </section>
    </main>

    <script>
  // =====================================================
  // CONFIG
  // =====================================================

  const API_BASE = "http://localhost:5293/api";

  const API = {
    users: "/User",
    groups: "/Group",
    lessons: "/Lesson",
    attendance: "/attendance",
  };


  // =====================================================
  // LOGIN
  // =====================================================

  const loggedInUser = JSON.parse(
    localStorage.getItem("codetrixUser")
  );

  if (!loggedInUser || !loggedInUser.accessToken) {
    window.location.href = "LoginPage.html";
  }


  // =====================================================
  // CURRENT USER
  // =====================================================

  const currentUserId = Number(loggedInUser.userId);

  // Login response may contain roleId OR only role.
  let currentRoleId = Number(loggedInUser.roleId);

  if (!currentRoleId) {
    if (loggedInUser.role === "Student") currentRoleId = 1;
    if (loggedInUser.role === "Mentor") currentRoleId = 2;
    if (loggedInUser.role === "Admin") currentRoleId = 3;
  }


  // =====================================================
  // DATA
  // =====================================================

  let users = [];
  let groups = [];
  let lessons = [];
  let attendance = [];

  let currentUser = null;


  // =====================================================
  // ROLE
  // =====================================================

  function getRoleName(roleId) {
    switch (Number(roleId)) {
      case 1:
        return "Student";

      case 2:
        return "Mentor";

      case 3:
        return "Admin";

      default:
        return "Unknown";
    }
  }


  // =====================================================
  // API REQUEST
  // =====================================================

  async function apiRequest(
    endpoint,
    method = "GET",
    body = null
  ) {
    const options = {
      method: method,

      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${loggedInUser.accessToken}`,
      },
    };

    if (body !== null) {
      options.body = JSON.stringify(body);
    }

    const response = await fetch(
      `${API_BASE}${endpoint}`,
      options
    );

    if (!response.ok) {
      let message = `Request failed: ${response.status}`;

      try {
        const error = await response.json();

        message =
          error.message ||
          error.error ||
          message;
      } catch {}

      throw new Error(message);
    }

    if (response.status === 204) {
      return null;
    }

    return await response.json();
  }


  // =====================================================
  // LOAD PAGE
  // =====================================================

  async function loadPage() {
    try {
      updateHeader();

      // -----------------------------------------------
      // USERS
      // -----------------------------------------------

      users = await apiRequest(API.users);

      currentUser = users.find(
        user =>
          Number(user.userId) === currentUserId
      );

      if (!currentUser) {
        throw new Error("Current user not found.");
      }

      console.log("Current user:", currentUser);


      // -----------------------------------------------
      // GROUPS
      // -----------------------------------------------

      const allGroups =
        await apiRequest(API.groups);

      console.log("All groups:", allGroups);


      // -----------------------------------------------
      // Get groups visible to current user
      // -----------------------------------------------

      if (currentRoleId === 1) {

        // Student → only their group

        const groupId =
          Number(currentUser.groupId);

        if (groupId) {
          groups = allGroups.filter(
            group =>
              Number(group.groupId) === groupId
          );
        } else {
          groups = [];
        }

      } else if (currentRoleId === 2) {

        // Mentor → groups created by mentor

        groups = allGroups.filter(
          group =>
            Number(group.createdByMentorId) ===
            currentUserId
        );

      } else if (currentRoleId === 3) {

        // Admin → all groups

        groups = allGroups;

      } else {

        groups = [];
      }


      console.log("Visible groups:", groups);


      // -----------------------------------------------
      // LESSONS
      // -----------------------------------------------

      lessons =
        await apiRequest(API.lessons);

      console.log("All lessons:", lessons);


      // -----------------------------------------------
      // ATTENDANCE
      // -----------------------------------------------

      attendance =
        await apiRequest(API.attendance);

      console.log(
        "All attendance:",
        attendance
      );


      // -----------------------------------------------
      // RENDER
      // -----------------------------------------------

      renderProfile();

      renderGroups();

      renderLessons();

      renderAttendance();

    } catch (error) {

      console.error(error);

      showError(error.message);
    }
  }


  // =====================================================
  // HEADER
  // =====================================================

  function updateHeader() {

    const name =
      loggedInUser.userName || "";

    const surname =
      loggedInUser.userSurName || "";

    document.getElementById(
      "headerName"
    ).textContent =
      `${name} ${surname}`;

    document.getElementById(
      "headerRole"
    ).textContent =
      getRoleName(currentRoleId);
  }


  // =====================================================
  // PROFILE
  // =====================================================

  function renderProfile() {

    const container =
      document.getElementById("profile");

    if (!currentUser) {

      container.innerHTML = `
        <div class="error">
          User information not found.
        </div>
      `;

      return;
    }


    container.innerHTML = `
      <div class="profile-grid">

        <div class="info">
          <span class="info-label">
            Name
          </span>

          <span class="info-value">
            ${escapeHtml(
              currentUser.userName
            )}
          </span>
        </div>


        <div class="info">
          <span class="info-label">
            Surname
          </span>

          <span class="info-value">
            ${escapeHtml(
              currentUser.userSurName
            )}
          </span>
        </div>


        <div class="info">
          <span class="info-label">
            Email
          </span>

          <span class="info-value">
            ${escapeHtml(
              currentUser.email
            )}
          </span>
        </div>


        <div class="info">
          <span class="info-label">
            Phone
          </span>

          <span class="info-value">
            ${escapeHtml(
              currentUser.phoneNumber || "-"
            )}
          </span>
        </div>


        <div class="info">
          <span class="info-label">
            Role
          </span>

          <span class="info-value">
            ${getRoleName(
              currentUser.roleId
            )}
          </span>
        </div>


        <div class="info">
          <span class="info-label">
            Group ID
          </span>

          <span class="info-value">
            ${currentUser.groupId ?? "-"}
          </span>
        </div>

      </div>
    `;
  }


  // =====================================================
  // GROUPS
  // =====================================================

  function renderGroups() {

    const container =
      document.getElementById("groups");

    if (!groups.length) {

      container.innerHTML = `
        <div class="empty">
          No groups found.
        </div>
      `;

      return;
    }


    container.innerHTML = `
      <div class="group-grid">

        ${groups.map(group => `

          <div class="group-card">

            <h3>
              ${escapeHtml(
                group.groupName
              )}
            </h3>

            <p>
              <strong>Group ID:</strong>
              ${group.groupId}
            </p>

            <p>
              <strong>Course:</strong>
              ${escapeHtml(
                group.courseName || "-"
              )}
            </p>

            <p>
              <strong>Students:</strong>
              ${group.studentsCount ?? 0}
            </p>

            <p>
              <strong>Tasks:</strong>
              ${group.tasksCount ?? 0}
            </p>

            <p>
              <strong>Lessons:</strong>
              ${group.lessonsCount ?? 0}
            </p>

            ${
              group.createdByMentorName
                ? `
                  <p>
                    <strong>Mentor:</strong>
                    ${escapeHtml(
                      group.createdByMentorName
                    )}
                  </p>
                `
                : ""
            }

          </div>

        `).join("")}

      </div>
    `;
  }


  // =====================================================
  // VISIBLE GROUP IDS
  // =====================================================

  function getVisibleGroupIds() {

    return groups.map(
      group =>
        Number(group.groupId)
    );
  }


  // =====================================================
  // LESSONS
  // =====================================================

  function renderLessons() {

    const container =
      document.getElementById("lessons");

    const groupIds =
      getVisibleGroupIds();


    const visibleLessons =
      lessons.filter(
        lesson =>
          groupIds.includes(
            Number(lesson.groupId)
          )
      );


    console.log(
      "Visible lessons:",
      visibleLessons
    );


    if (!visibleLessons.length) {

      container.innerHTML = `
        <div class="empty">
          No lessons found for your group.
        </div>
      `;

      return;
    }


    container.innerHTML =
      visibleLessons.map(
        lesson => `

          <div class="lesson-card">

            <h3>
              Lesson #${lesson.lessonId}
            </h3>

            <p>
              <strong>Group:</strong>
              ${escapeHtml(
                getGroupName(
                  lesson.groupId
                )
              )}
            </p>

            <p>
              <strong>Type:</strong>

              <span class="badge">
                ${escapeHtml(
                  lesson.type || "-"
                )}
              </span>
            </p>

            <p>
              <strong>Starts:</strong>
              ${formatDate(
                lesson.lessonStarts
              )}
            </p>

            <p>
              <strong>Ends:</strong>
              ${formatDate(
                lesson.lessonEnds
              )}
            </p>

            <p>
              <strong>Classroom:</strong>
              ${escapeHtml(
                lesson.classRoom || "-"
              )}
            </p>

          </div>

        `
      ).join("");
  }


  // =====================================================
  // ATTENDANCE
  // =====================================================

  function renderAttendance() {

    const container =
      document.getElementById(
        "attendance"
      );

    const groupIds =
      getVisibleGroupIds();


    const visibleAttendance =
      attendance.filter(
        record =>
          groupIds.includes(
            Number(record.groupId)
          )
      );


    console.log(
      "Visible attendance:",
      visibleAttendance
    );


    if (!visibleAttendance.length) {

      container.innerHTML = `
        <div class="empty">
          No attendance records found
          for your group.
        </div>
      `;

      return;
    }


    // Student
    if (currentRoleId === 1) {

      renderStudentAttendance(
        container,
        visibleAttendance
      );

      return;
    }


    // Mentor / Admin
    renderMentorAttendance(
      container,
      visibleAttendance
    );
  }


  // =====================================================
  // STUDENT ATTENDANCE
  // =====================================================

  function renderStudentAttendance(
    container,
    records
  ) {

    const rows = [];


    records.forEach(record => {

      const student =
        record.students?.find(
          s =>
            Number(s.studentId) ===
            currentUserId
        );


      if (!student) {
        return;
      }


      rows.push(`

        <tr>

          <td>
            ${record.lessonId}
          </td>

          <td>
            ${escapeHtml(
              record.lessonName || "-"
            )}
          </td>

          <td>
            ${formatDate(
              record.recordedAt
            )}
          </td>

          <td>
            ${attendanceStatusName(
              student.status
            )}
          </td>

        </tr>

      `);
    });


    if (!rows.length) {

      container.innerHTML = `
        <div class="empty">
          No attendance records for you.
        </div>
      `;

      return;
    }


    container.innerHTML = `

      <div class="table-container">

        <table>

          <thead>

            <tr>
              <th>Lesson</th>
              <th>Lesson Name</th>
              <th>Recorded</th>
              <th>Status</th>
            </tr>

          </thead>

          <tbody>
            ${rows.join("")}
          </tbody>

        </table>

      </div>

    `;
  }


  // =====================================================
  // MENTOR / ADMIN ATTENDANCE
  // =====================================================

  function renderMentorAttendance(
    container,
    records
  ) {

    const rows = [];


    records.forEach(record => {

      if (
        !record.students ||
        !record.students.length
      ) {

        rows.push(`

          <tr>

            <td>
              ${record.lessonId}
            </td>

            <td>
              ${escapeHtml(
                record.lessonName || "-"
              )}
            </td>

            <td colspan="4">
              No students found
            </td>

          </tr>

        `);

        return;
      }


      record.students.forEach(
        student => {

          rows.push(`

            <tr>

              <td>
                ${record.lessonId}
              </td>

              <td>
                ${escapeHtml(
                  record.lessonName || "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  student.studentName
                )}
                ${escapeHtml(
                  student.studentSurname
                )}
              </td>

              <td>
                ${formatDate(
                  record.recordedAt
                )}
              </td>

              <td>

                <select
                  id="attendance-${student.attendanceStudentId}"
                >

                  <option
                    value="true"
                    ${
                      isPresent(
                        student.status
                      )
                        ? "selected"
                        : ""
                    }
                  >
                    Present
                  </option>

                  <option
                    value="false"
                    ${
                      !isPresent(
                        student.status
                      )
                        ? "selected"
                        : ""
                    }
                  >
                    Absent
                  </option>

                </select>

              </td>

              <td>

                <button
                  class="btn-primary"
                  onclick="
                    updateAttendance(
                      ${student.attendanceStudentId},
                      ${record.attendanceId}
                    )
                  "
                >
                  Save
                </button>

              </td>

            </tr>

          `);
        }
      );
    });


    container.innerHTML = `

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>Lesson</th>
              <th>Lesson Name</th>
              <th>Student</th>
              <th>Recorded</th>
              <th>Status</th>
              <th>Action</th>

            </tr>

          </thead>

          <tbody>
            ${rows.join("")}
          </tbody>

        </table>

      </div>

    `;
  }


  // =====================================================
  // UPDATE ATTENDANCE
  // =====================================================

  async function updateAttendance(
    attendanceStudentId,
    attendanceId
  ) {

    const select =
      document.getElementById(
        `attendance-${attendanceStudentId}`
      );


    if (!select) {
      return;
    }


    const status =
      select.value === "true";


    try {

      const record =
        attendance.find(
          a =>
            Number(a.attendanceId) ===
            Number(attendanceId)
        );


      const student =
        record?.students?.find(
          s =>
            Number(
              s.attendanceStudentId
            ) ===
            Number(
              attendanceStudentId
            )
        );


      if (!student) {
        throw new Error(
          "Attendance student not found."
        );
      }


      await apiRequest(
        `${API.attendance}/${attendanceStudentId}`,
        "PATCH",
        {
          studentId:
            Number(student.studentId),

          status: status,
        }
      );


      alert(
        "Attendance updated."
      );


      await reloadAttendance();

    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Failed to update attendance."
      );
    }
  }


  // =====================================================
  // RELOAD ATTENDANCE
  // =====================================================

  async function reloadAttendance() {

    attendance =
      await apiRequest(
        API.attendance
      );

    renderAttendance();
  }


  // =====================================================
  // HELPERS
  // =====================================================

  function getGroupName(groupId) {

    const group =
      groups.find(
        group =>
          Number(group.groupId) ===
          Number(groupId)
      );

    return group
      ? group.groupName
      : "-";
  }


  function attendanceStatusName(status) {

    return isPresent(status)
      ? "Present"
      : "Absent";
  }


  function isPresent(status) {

    return (
      status === true ||
      String(status).toLowerCase() ===
        "true"
    );
  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    return date.toLocaleString();
  }


  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function showError(message) {

    document.querySelector(
      "main"
    ).innerHTML = `

      <div class="error">
        ${escapeHtml(message)}
      </div>

    `;
  }


  // =====================================================
  // LOGOUT
  // =====================================================

  function logout() {

    localStorage.removeItem(
      "codetrixUser"
    );

    window.location.href =
      "Login.html";
  }


  // =====================================================
  // START
  // =====================================================

  loadPage();
</script>
  </body>
</html>
